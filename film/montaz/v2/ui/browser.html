<!DOCTYPE html>
<!-- Phone screens BEFORE Bezpiecznik (scene 3): a plain mobile browser search that never loads, then the
     offline page. One state per render: browser.html?s=type&n=<chars> | s=load&n=<frame> | s=off&n=<0|1 pressed>
     Rendered at 904x1968 (2x the 452x984 screen of the storyboard phone). -->
<html lang="pl"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "UI"; src: url(../../plansze/fonts/InterDisplay-Regular.ttf); font-weight: 400; }
  @font-face { font-family: "UI"; src: url(../../plansze/fonts/InterDisplay-Medium.ttf); font-weight: 500; }
  @font-face { font-family: "UI"; src: url(../../plansze/fonts/InterDisplay-SemiBold.ttf); font-weight: 600; }
  html, body { margin: 0; width: 904px; height: 1968px; background: #f3f3f1; overflow: hidden; font-family: "UI", sans-serif; color: #202124; }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 96px; display: flex; justify-content: space-between;
         align-items: center; padding: 0 60px; font-size: 30px; font-weight: 600; color: #111; }
  .bar span:last-child { font-weight: 500; font-size: 27px; }
  .url { position: absolute; top: 112px; left: 32px; right: 32px; height: 92px; border-radius: 46px; background: #e3e3df;
         display: flex; align-items: center; padding: 0 36px; font-size: 31px; color: #444; gap: 22px; }
  .prog { position: absolute; top: 214px; left: 0; height: 6px; background: #3b6fd8; }
  .box { position: absolute; top: 300px; left: 48px; right: 48px; height: 110px; border-radius: 55px; background: #fff;
         box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; align-items: center; padding: 0 44px; font-size: 38px; gap: 26px; }
  .caret { display: inline-block; width: 3px; height: 44px; background: #3b6fd8; vertical-align: middle; margin-left: 2px; }
  .sugg { position: absolute; top: 440px; left: 48px; right: 48px; font-size: 34px; color: #555; line-height: 96px; }
  .sugg div { border-bottom: 1px solid #ddd; padding-left: 70px; }
  .spin { position: absolute; top: 760px; left: 402px; width: 100px; height: 100px; border-radius: 50%;
          border: 9px solid #d6d6d2; border-top-color: #3b6fd8; box-sizing: border-box; }
  .off { position: absolute; top: 520px; left: 80px; right: 80px; }
  .off svg { width: 120px; height: 120px; }
  .off h1 { font-size: 50px; font-weight: 600; margin: 50px 0 26px; }
  .off p { font-size: 33px; line-height: 1.45; color: #5f6368; margin: 0 0 14px; }
  .btn { position: absolute; top: 1420px; right: 80px; padding: 30px 52px; border-radius: 52px; background: #3b6fd8;
         color: #fff; font-size: 34px; font-weight: 500; }
  .btn.down { background: #2c58b5; transform: scale(.97); }
  .kb { position: absolute; bottom: 0; left: 0; right: 0; height: 640px; background: #d9dadd; }
  .kb i { position: absolute; width: 74px; height: 104px; background: #fff; border-radius: 12px; box-shadow: 0 2px 0 #aaa; }
</style></head><body>
<div class="bar"><span>03:12</span><span>Brak usługi ▭</span></div>
<div class="url"><svg width="30" height="30" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" fill="none" stroke="#555" stroke-width="2.4"/><path d="M15 15l6 6" stroke="#555" stroke-width="2.4"/></svg><span id="u">Wyszukaj lub wpisz adres</span></div>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search), s = q.get("s") || "type", n = +(q.get("n") || 0);
const TXT = "syrena wyje gdzie sie schowac";
const root = document.getElementById("root");
const kb = () => { let h = '<div class="kb">'; for (let r = 0; r < 3; r++) for (let c = 0; c < 10 - r; c++)
  h += `<i style="left:${14 + r * 40 + c * 88}px;top:${30 + r * 130}px"></i>`; return h + '<i style="left:200px;top:420px;width:500px"></i></div>'; };
if (s === "type") {
  root.innerHTML = `<div class="box">${TXT.slice(0, n)}<span class="caret"></span></div>` +
    (n > 8 ? `<div class="sugg"><div>${TXT.slice(0, n)} co robić</div><div>${TXT.slice(0, n)} dzisiaj</div></div>` : "") + kb();
} else if (s === "load") {
  document.getElementById("u").textContent = TXT;
  root.innerHTML = `<div class="prog" style="width:${Math.min(70, 8 + n * 0.9)}%"></div>` +
    `<div class="spin" style="transform:rotate(${n * 30}deg)"></div>`;
} else {
  document.getElementById("u").textContent = TXT;
  root.innerHTML = `<div class="off"><svg viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="19" r="1.3" fill="#9aa0a6"/><path d="M3 3l18 18" stroke="#9aa0a6" stroke-width="1.6" stroke-linecap="round"/></svg>
    <h1>Brak połączenia z internetem</h1><p>Sprawdź połączenie sieciowe.</p><p>ERR_INTERNET_DISCONNECTED</p></div>
    <div class="btn ${n ? "down" : ""}">Spróbuj ponownie</div>`;
}
</script></body></html>
